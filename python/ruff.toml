# https://docs.astral.sh/ruff/rules/

target-version = 'py312'  # minimum version to target
indent-width = 4
line-length = 75

builtins = ['_']
extend-exclude = [
    '.vscode',
]


[format]  # usless as black
docstring-code-format = true
indent-style = 'space'
line-ending = 'lf'
quote-style = 'single'
skip-magic-trailing-comma = false


[lint.flake8-quotes]
inline-quotes = 'single'


[lint.flake8-import-conventions.extend-aliases]
'datetime' = 'dt'


[lint.isort]
force-single-line = true  # Forces all from imports to appear on their own line.
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1  # Use a single line between direct and from import.


[lint.per-file-ignores]
'__init__.py' = [
    'unused-import',                    # F401
    'undefined-local-with-import-star'  # F403
]


[lint]
preview = true
extend-select = [  # default [ 'E4', 'E7', 'E9', 'F' ]
    'YTT',         # flake8-2020
    'S',           # flake8-bandit
    'FBT',         # flake8-boolean-trap
    'A',           # flake8-builtins
    'COM',         # flake8-commas
    'C4',          # flake8-comprehensions
    'DTZ',         # flake8-datetimez
    'ICN',         # flake8-import-conventions
    'Q',           # flake8-quote
    'RET',         # flake8-return
    'SIM',         # flake8-simplify
    'ARG',         # flake8-unused-arguments
    'PTH',         # flake8-use-pathlib
    'I',           # isort
    'C90',         # mccabe
    'N',           # pep8-naming
    'PERF',        # perflint
    'E',           # pycodestyle
    'F',           # pyflakes
    'PGH',         # pygrep-hooks
    'PL',          # pylint
    'UP',          # pyupgrade
    'RUF',         # ruff-specific
]

ignore = [
    'unnecessary-collection-call',                        # C408 flake8-comprehensions.unnecessary-collection-call

    'boolean-default-value-positional-argument',          # FBT002 flake8-boolean-trap.boolean-default-value-positional-argument

    'implicit-return-value',                              # RET502 flake8-return.implicit-return-value
    'implicit-return',                                    # RET503 flake8-return.implicit-return

    'avoidable-escaped-quote',                            # Q003 flake8-quote.avoidable-escaped-quote

    'yoda-conditions',                                    # SIM300 flake8-simplify.yoda-conditions
    'collapsible-if',                                     # SIM102 flake8-simplify.collapsible-if

    'unsorted-imports',                                   # I001 isort.unsorted-imports

    'invalid-function-name',                              # N802 pep8-naming.invalid-function-name
    'invalid-argument-name',                              # N803 pep8-naming.invalid-argument-name
    'non-lowercase-variable-in-function',                 # N806 pep8-naming.non-lowercase-variable-in-function
    'mixed-case-variable-in-class-scope',                 # N815 pep8-naming.mixed-case-variable-in-class-scope
    'mixed-case-variable-in-global-scope',                # N816 pep8-naming.mixed-case-variable-in-global-scope

    'whitespace-after-open-bracket',                      # E201 pycodestyle.whitespace-after-open-bracket '['
    'whitespace-before-close-bracket',                    # E202 pycodestyle.whitespace-before-close-bracket ']'
    'whitespace-before-punctuation',                      # E203 pycodestyle.whitespace-before-punctuation
    'multiple-spaces-before-operator',                    # E221 pycodestyle.multiple-spaces-before-operator
    'unexpected-spaces-around-keyword-parameter-equals',  # E251 pycodestyle.unexpected-spaces-around-keyword-parameter-equals
    'multiple-leading-hashes-for-block-comment',          # E266 pycodestyle.multiple-leading-hashes-for-block-comment
    'multiple-spaces-after-keyword',                      # E271 pycodestyle.multiple-spaces-after-keyword
    'multiple-statements-on-one-line-colon',              # E701 pycodestyle.multiple-statements-on-one-line-colon
    'multiple-statements-on-one-line-semicolon',          # E702 pycodestyle.multiple-statements-on-one-line-semicolon
    'true-false-comparison',                              # E712 pycodestyle.true-false-comparison
    'ambiguous-variable-name',                            # E741 pycodestyle.ambiguous-variable-name {I, O, l}

    'compare-to-empty-string',                            # PLC1901 pylint.compare-to-empty-string
    'too-many-return-statements',                         # PLR0911 pylint.too-many-return-statements
    'magic-value-comparison',                             # PLR2004 pylint.magic-value-comparison

    'f-string',                                           # UP032 pyupgrade.f-string : prefer f-string over format

    'mutable-class-default',                              # RUF012 ruff-specific.mutable-class-default
    'unsorted-dunder-all',                                # RUF022 ruff-specific.unsorted-dunder-all
    'noqa-comments',                                      # RUF105 ruff-specific.noqa-comments
]
